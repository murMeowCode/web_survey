repos:
  # 1. Проверка Conventional Commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.20.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # 2. Проверка pylint (исправленная версия)
  - repo: local
    hooks:
      - id: pylint
        name: pylint (main_auth)
        entry: pylint --disable=R0903,E0401
        language: python  # ← Изменили на 'python' вместо 'system'
        types: [python]
        files: ^main_auth/
        additional_dependencies: [pylint]  # Теперь работает
        args: [--disable=R0903,E0401]
        verbose: true