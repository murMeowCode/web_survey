[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version = "0.0.1"
update_changelog_on_bump = true
major_version_zero = true

[tool.commitizen.customize]
message_template = "{msg}"  # Шаблон сообщения коммита
example = "feat: add new feature"  # Пример коммита
schema = "<type>(<scope>): <subject>"  # Схема коммита

[tool.pytest.ini_options]
env_files = [".env.test"]